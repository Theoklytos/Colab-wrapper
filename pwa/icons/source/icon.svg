<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background: dark rounded square for the "any" icons -->
  <rect width="512" height="512" rx="96" fill="#0a0a0a"/>

  <!-- Colab-style notebook page -->
  <rect x="120" y="100" width="272" height="340" rx="20" fill="#1e1e1e" stroke="#2a2a2a" stroke-width="4"/>

  <!-- Notebook lines -->
  <rect x="152" y="160" width="208" height="16" rx="8" fill="#3a3a3a"/>
  <rect x="152" y="200" width="160" height="16" rx="8" fill="#3a3a3a"/>
  <rect x="152" y="240" width="184" height="16" rx="8" fill="#3a3a3a"/>
  <rect x="152" y="280" width="140" height="16" rx="8" fill="#3a3a3a"/>

  <!-- Code block (orange accent) -->
  <rect x="152" y="320" width="208" height="72" rx="12" fill="#f9ab00" fill-opacity="0.12" stroke="#f9ab00" stroke-width="2" stroke-opacity="0.4"/>
  <rect x="168" y="336" width="120" height="10" rx="5" fill="#f9ab00"/>
  <rect x="168" y="358" width="80" height="10" rx="5" fill="#f9ab00" fill-opacity="0.5"/>

  <!-- Play button (run cell) -->
  <circle cx="374" cy="136" r="40" fill="#f9ab00"/>
  <path d="M361 118 L361 154 L393 136 Z" fill="#000"/>
</svg>
