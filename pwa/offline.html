<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <link rel="stylesheet" href="/styles/tokens.css">
  <title>Offline — Colab Mobile</title>
  <style>
    body {
      font-family: var(--font-sans, system-ui, sans-serif);
      background: var(--color-bg-primary, #0a0a0a);
      color: var(--color-text-primary, #f5f5f5);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      padding: 2rem;
      text-align: center;
    }
    .icon {
      font-size: 3rem;
      margin-bottom: 0.5rem;
    }
    h1 { font-size: 1.5rem; font-weight: 700; }
    p { color: var(--color-text-secondary, #a0a0a0); font-size: 1rem; line-height: 1.6; }
    button {
      margin-top: 1rem;
      padding: 0.875rem 2rem;
      background: var(--color-accent, #f9ab00);
      color: #000;
      border: none;
      border-radius: 9999px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      min-height: 52px;
    }
  </style>
</head>
<body>
  <div class="icon" aria-hidden="true">📡</div>
  <h1>You're offline</h1>
  <p>Colab Mobile needs a network connection to launch Google Colab. Connect to Wi-Fi or mobile data and try again.</p>
  <button onclick="location.reload()">Try again</button>
</body>
</html>
